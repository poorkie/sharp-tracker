name: scan

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 min (GitHub often runs these a few minutes late)
  workflow_dispatch: {}       # lets you hit "Run workflow" by hand

permissions:
  contents: write             # needed to commit state + RECORD.md back

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          ALERT_TO_PHONE: ${{ secrets.ALERT_TO_PHONE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python run.py
      - name: Save state
        run: |
          git config user.name "sharp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state RECORD.md docs
          git diff --cached --quiet || git commit -m "scan $(date -u +%FT%TZ)"
          git pull --rebase -X ours --quiet || true
          git push
