name: backtest

on:
  workflow_dispatch:
    inputs:
      cutoff:
        description: "Grade on games before this date, test after"
        default: "2026-09-01"
  push:
    branches: [main]
    paths: ["backtest.py", "props.py", "sports_check.py", ".github/workflows/backtest.yml"]

permissions:
  contents: write

concurrency:
  group: backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Which analysis
        id: which
        run: |
          changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
          if echo "$changed" | grep -q '^sports_check.py$'; then s=sports_check.py
          elif echo "$changed" | grep -q '^props.py$'; then s=props.py
          else s=backtest.py; fi
          echo "script=$s" >> $GITHUB_OUTPUT
      - run: python ${{ steps.which.outputs.script }} --cutoff "${{ github.event.inputs.cutoff || '2026-09-01' }}"
      - name: Save results
        run: |
          git config user.name "sharp-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add BACKTEST.md docs/backtest.json PROPS.md docs/props.json SPORTS.md docs/sports_check.json 2>/dev/null || true
          git commit -m "backtest results" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs --quiet && git push && exit 0
            sleep 10
          done
          exit 1
