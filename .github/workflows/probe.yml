name: probe
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["probe.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install requests polymarket-us || pip install requests
      - run: python probe.py
      - run: |
          git config user.name "sharp-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add PROBE.md; git commit -m "probe results" || true
          git pull --rebase -X ours -q || true; git push
